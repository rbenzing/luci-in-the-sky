    cvss_score: 8.1
    cvss_vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
    severity: high
    detection_method: version
    component: opkg
    remediation: >
      Update to OpenWrt 19.07.1 or later. Use HTTPS package feeds and verify
      package signatures.
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2020-7982"
    tags: [integrity, supply-chain, mitm]

