# LuCI/OpenWrt CVE Database
# Format: id, title, description, affected_versions (semver range strings),
#         cvss_score, cvss_vector, severity, detection_method, remediation,
#         references, component, tags

version: 1
updated: "2026-07-06"
source: "https://raw.githubusercontent.com/rbenzing/luci-in-the-sky/main/luci_sky/cve/data/luci_cves.yml"

cves:
  - id: CVE-2019-12272
    title: "OpenWrt LuCI Default Credentials Authentication Bypass"
    description: >
      OpenWrt LuCI before 2019-01-04 has a default empty root password that allows
      unauthenticated remote attackers to gain full administrative access.
    affected_versions:
      - "< 18.06.2"
    cvss_score: 9.8
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    severity: critical
    detection_method: version
    component: luci-base
    remediation: >
      Set a strong root password via System > Administration. Update to OpenWrt 18.06.2
      or later which enforces password setup on first boot.
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2019-12272"
      - "https://openwrt.org/advisory/2019-12-272"
    tags: [authentication, default-credentials]

  - id: CVE-2022-46623
    title: "OpenWrt LuCI Remote Code Execution via Command Injection"
    description: >
      OpenWrt through 21.02.4 allows command injection via the diagnostics ping
      functionality, enabling authenticated users to execute arbitrary OS commands.
    affected_versions:
      - ">= 19.07.0"
      - "< 21.02.5"
    cvss_score: 8.8
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
    severity: high
    detection_method: version
    component: luci-app-diag
    remediation: >
      Update to OpenWrt 21.02.5 or later. Disable diagnostics page for
      untrusted users.
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2022-46623"
    tags: [injection, command-injection]

  - id: CVE-2024-54143
    title: "OpenWrt opkg Package Manager Supply Chain Attack"
    description: >
      OpenWrt opkg package manager in versions before 23.05.5 is vulnerable to
      a supply chain attack via SHA-256 collision in package index signing.
    affected_versions:
      - "< 23.05.5"
    cvss_score: 9.3
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N"
    severity: critical
    detection_method: version
    component: opkg
    remediation: >
      Update to OpenWrt 23.05.5 or later immediately. Verify package integrity
      using official channels only.
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2024-54143"
    tags: [supply-chain, integrity]

  - id: CVE-2019-5101
    title: "OpenWrt LuCI Session Token Predictability"
    description: >
      OpenWrt LuCI generates predictable sysauth session tokens using a weak
      PRNG seeded with insufficient entropy, allowing session hijacking.
    affected_versions:
      - "< 18.06.1"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    severity: high
    detection_method: version
    component: luci-base
    remediation: >
      Update to OpenWrt 18.06.1 or later which uses /dev/urandom for session
      token generation.
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2019-5101"
    tags: [session, entropy]

  - id: CVE-2019-5102
    title: "OpenWrt LuCI Low Session Token Entropy"
    description: >
      OpenWrt LuCI uses a 32-bit session token with low effective entropy,
      allowing brute-force attacks to hijack admin sessions.
    affected_versions:
      - "< 18.06.2"
    cvss_score: 7.5
    cvss_vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    severity: high
    detection_method: behavior
    component: luci-base
    remediation: >
      Update to OpenWrt 18.06.2 or later. Enable session timeout and ensure
      HTTPS is used to protect session cookies.
    references:
      - "https://nvd.nist.gov/vuln/detail/CVE-2019-5102"
    tags: [session, entropy, brute-force]

  - id: CVE-2020-7982
    title: "OpenWrt opkg MITM Package Installation"
