[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luci-redteam"
version = "1.0.0"
description = "Red team security scanning framework for LuCI/OpenWrt web interfaces"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LuCI-RedTeam Contributors"},
]
keywords = ["security", "pentest", "openwrt", "luci", "redteam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28.0",
    "click>=8.1.0",
    "colorama>=0.4.6",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "rich>=13.0.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.0",
    "requests-mock>=1.11.0",
    "werkzeug>=2.3.0",
    "flask>=2.3.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
luci-sky = "luci_sky.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["luci_sky*"]

[tool.setuptools.package-data]
luci_sky = [
    "cve/data/*.yaml",
    "cve/data/*.yml",
    "reporters/templates/*.html",
    "reporters/templates/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
