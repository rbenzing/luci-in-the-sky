[pytest]
testpaths = tests
addopts = -v --tb=short --basetemp=.pytest_tmp
markers =
    integration: marks tests as integration tests that require a live or mock server (deselect with '-m "not integration"')
    slow: marks tests as slow-running (deselect with '-m "not slow"')
    network: marks tests that make real network calls
filterwarnings =
    ignore::DeprecationWarning:luci_pentest
